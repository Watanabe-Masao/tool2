<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 配分表作成システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #999;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            margin-bottom: -2px;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .helper-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>配分表作成システム</h1>
            <p>Distribution Management System</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">ログイン</button>
            <button class="tab" onclick="switchTab('register')">新規登録</button>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <!-- ログインフォーム -->
        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">メールアドレス</label>
                    <input type="email" id="login-email" required placeholder="tanaka@example.com">
                </div>
                <div class="form-group">
                    <label for="login-password">パスワード</label>
                    <input type="password" id="login-password" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn" id="login-btn">
                    ログイン
                </button>
            </form>
        </div>

        <!-- 新規登録フォーム -->
        <div id="register-form" class="form-container">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="register-name">担当バイヤー名</label>
                    <input type="text" id="register-name" required placeholder="田中 太郎">
                </div>
                <div class="form-group">
                    <label for="register-email">メールアドレス</label>
                    <input type="email" id="register-email" required placeholder="tanaka@example.com">
                </div>
                <div class="form-group">
                    <label for="register-password">パスワード（6文字以上）</label>
                    <input type="password" id="register-password" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn" id="register-btn">
                    新規登録
                </button>
            </form>
        </div>

        <div class="helper-text">
            <p>初めての方は「新規登録」から始めてください</p>
        </div>
    </div>

    <script type="module">
        import authService from '/static/js/auth-service.js';

        window.switchTab = function(tab) {
            // タブの切り替え
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }

            // エラーメッセージをクリア
            hideMessage();
        };

        window.handleLogin = async function(event) {
            event.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            // ローディング開始
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> ログイン中...';
            hideMessage();

            try {
                const result = await authService.login(email, password);

                if (result.success) {
                    showMessage('ログインしました！リダイレクト中...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showMessage(result.error, 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'ログイン';
                }
            } catch (error) {
                showMessage('ログインに失敗しました', 'error');
                btn.disabled = false;
                btn.innerHTML = 'ログイン';
            }
        };

        window.handleRegister = async function(event) {
            event.preventDefault();

            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const btn = document.getElementById('register-btn');

            // ローディング開始
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 登録中...';
            hideMessage();

            try {
                const result = await authService.register(email, password, name);

                if (result.success) {
                    showMessage('登録が完了しました！ログイン中...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showMessage(result.error, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '新規登録';
                }
            } catch (error) {
                showMessage('登録に失敗しました', 'error');
                btn.disabled = false;
                btn.innerHTML = '新規登録';
            }
        };

        function showMessage(message, type) {
            hideMessage();
            const element = document.getElementById(type === 'error' ? 'error-message' : 'success-message');
            element.textContent = message;
            element.classList.add('show');
        }

        function hideMessage() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');
        }

        // 既にログイン済みの場合はリダイレクト
        authService.onAuthStateChange((user) => {
            if (user) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
