services:
  - type: web
    name: haibun-template-creator
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    # 自動デプロイを有効化（デフォルトでtrue）
    autoDeploy: true
