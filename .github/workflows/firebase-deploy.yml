name: Deploy to Firebase

on:
  push:  # すべてのブランチで自動デプロイ
  workflow_dispatch:  # 手動トリガーも許可

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://tool2-zopk.onrender.com/api

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create service account key file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > gcloud-service-key.json

      - name: Deploy to Firebase
        run: firebase deploy --non-interactive --project haibun-distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./gcloud-service-key.json
