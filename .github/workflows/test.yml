name: Tests

on:
  push:
    branches: [ main, master ]  # claude/** ブランチを一時的に除外
  pull_request:
    branches: [ main, master ]
  # 手動トリガーを追加
  workflow_dispatch:

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    name: Frontend Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test -- --run

    - name: Run frontend tests with coverage
      working-directory: ./frontend
      run: npm run test:coverage -- --run

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage

  e2e-test:
    runs-on: ubuntu-latest
    name: E2E Tests (Playwright)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      working-directory: ./frontend
      run: npm run test:e2e

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with pytest
      run: |
        pytest test_haibun_template_creator.py -v --cov=haibun_template_creator --cov-report=term-missing

    - name: Check test coverage
      run: |
        pytest test_haibun_template_creator.py --cov=haibun_template_creator --cov-fail-under=80

  render-loop-detection:
    runs-on: ubuntu-latest
    name: Render Loop Detection (React #185)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run render loop detection tests
      working-directory: ./frontend
      run: npm test -- --run --reporter=verbose src/__tests__/performance/PageRenderCounts.test.tsx src/__tests__/components/RenderLoopPrevention.test.tsx

    - name: Comment on PR with warning if tests fail
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ **React #185 (Maximum update depth exceeded) の可能性**\n\nレンダリング回数監視テストが失敗しました。以下を確認してください:\n\n- `useMemo` / `useCallback` でオブジェクト・関数をメモ化しているか\n- `useEffect` の依存配列に不安定な参照が含まれていないか\n- `useWatch` の値を依存配列に含めていないか\n- Zustandセレクターで `useShallow` を使用しているか\n\n詳細は `npm test -- --run src/__tests__/performance/PageRenderCounts.test.tsx` で確認できます。'
          })

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: Check circular dependencies
      working-directory: ./frontend
      run: npm run check-circular-deps

    - name: Check SSOT violations
      working-directory: ./frontend
      run: npm run check-ssot

    - name: Check zIndex usage rules
      working-directory: ./frontend
      run: npm run check-zindex

    - name: Comment on PR with zIndex violations
      if: failure() && github.event_name == 'pull_request' && steps.check-zindex.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ **zIndex使用ルールに違反しています**\n\nハードコードされたzIndex値が検出されました。型付きヘルパー関数 `zIndex()` または定数を使用してください。\n\n**推奨: 型付きヘルパー関数（タイプセーフ・補完が効く）**\n```tsx\nimport { zIndex } from \"@/constants/zIndex\";\n\n// ✅ レイヤーのみ指定\n<Dialog sx={{ zIndex: zIndex(\"PAGE_MODAL\") }}>\n\n// ✅ レイヤー + 要素オフセット\n<IconButton sx={{ zIndex: zIndex(\"PAGE_MODAL\", \"CLOSE_BUTTON\") }}>\n\n// ✅ Drawer内のSelect\n<Select MenuProps={{ sx: { zIndex: zIndex(\"NESTED_DIALOG\", \"SELECT_MENU\") } }} />\n```\n\n**または定数使用（後方互換性）**\n```tsx\n<Dialog sx={{ zIndex: MODAL_Z_INDEX.NESTED_DIALOG }}>\n<Select MenuProps={{ sx: { zIndex: MODAL_Z_INDEX.NESTED_DIALOG + ELEMENT_OFFSET.SELECT_MENU } }} />\n```\n\n詳細は `npm run check-zindex` で確認できます。'
          })

    - name: Comment on PR with circular dependency warning
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ 循環依存が検出されました。`npm run check-circular-deps` を実行して詳細を確認してください。'
          })

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  header-structure-test:
    runs-on: ubuntu-latest
    name: Header Structure Validation

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run header structure tests
      run: |
        pytest test_haibun_template_creator.py::TestHeaderStructure -v

    - name: Comment on PR with test results
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ ヘッダー構造のテストが失敗しました。H8（税込）とI8（入数）の位置が正しいか確認してください。'
          })
