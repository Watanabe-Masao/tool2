<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" fill="#1976d2" rx="64"/>

  <!-- Grid/Table Icon -->
  <g transform="translate(96, 96)">
    <!-- Header Row -->
    <rect x="0" y="0" width="100" height="50" fill="#ffffff" opacity="0.9" rx="4"/>
    <rect x="110" y="0" width="100" height="50" fill="#ffffff" opacity="0.9" rx="4"/>
    <rect x="220" y="0" width="100" height="50" fill="#ffffff" opacity="0.9" rx="4"/>

    <!-- Row 1 -->
    <rect x="0" y="60" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="110" y="60" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="220" y="60" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>

    <!-- Row 2 -->
    <rect x="0" y="120" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="110" y="120" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="220" y="120" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>

    <!-- Row 3 -->
    <rect x="0" y="180" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="110" y="180" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="220" y="180" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>

    <!-- Row 4 -->
    <rect x="0" y="240" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="110" y="240" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
    <rect x="220" y="240" width="100" height="50" fill="#ffffff" opacity="0.7" rx="4"/>
  </g>

  <!-- App Name Initial -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#ffffff" text-anchor="middle">配</text>
</svg>
